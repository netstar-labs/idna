# Everything under internal/x/ is vendored from golang.org/x/text and golang.org/x/net
# (BSD-3-Clause, Copyright The Go Authors) — a pruned snapshot, not a verbatim mirror
# (see internal/x/README.md), but changed only by a deliberate re-vendor, never by hand.
# Linting it is wrong twice over: the findings are upstream's to make, and "fixing" them
# would fork the vendored tree further from the upstream we re-sync against — which is
# the whole point of keeping it version-stamped and re-vendored as a unit.
#
# staticcheck reads config hierarchically, so this silences this directory and every
# package beneath it while idna's own code stays fully linted.
#
# This is why CI broke on 2026-07-28 without a code change: the workflow ran
# staticcheck@latest, and a new release added checks that the vendored code trips
# (U1000 unused, SA4006, ST1005). The pin added alongside this stops a future
# release doing the same to a different tree.
checks = ["-all"]
